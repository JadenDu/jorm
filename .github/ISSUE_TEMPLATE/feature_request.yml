name: 功能建议
description: 为 JORM 建议新功能或改进
title: "[feat] <简短、具体的标题>"
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！告诉我们你希望看到什么、以及为什么。

  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 你想完成的事情中，哪些是 JORM 目前难以做到的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: |
        简述你期望的 API（伪代码即可）。说明它应该挂在哪个
        Session 上（`FindSession`、`JormTemplate`...）。
      render: java
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: |
        目前在用的变通办法、考虑过的第三方库等。

  - type: dropdown
    id: module
    attributes:
      label: 受影响的模块
      options:
        - jorm-core（核心）
        - jorm-spring-boot-starter
        - 两者都有
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: 兼容性影响
      options:
        - label: 这将是一个破坏性变更
        - label: 我愿意为此提交 PR
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 贡献检查清单
      options:
        - label: 我已先搜索过已有 Issue
          required: true
