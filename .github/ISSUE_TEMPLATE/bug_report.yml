name: Bug 报告
description: 报告一个可复现的 JORM 缺陷
title: "[bug] <简短、具体的标题>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽时间提交 bug 报告！
        请先搜索已有 Issue 以避免重复。
        安全问题请见 `SECURITY.md` —— 涉及安全的敏感问题**请勿**提交公开报告。

  - type: input
    id: version
    attributes:
      label: JORM 版本
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 受影响的模块
      options:
        - jorm-core（核心）
        - jorm-spring-boot-starter
        - 两者都有
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK 版本
      placeholder: "Temurin 11.0.20"
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: 数据库 / JDBC 驱动
      placeholder: "MySQL 8.0.33, mysql-connector-j 8.0.33"
    validations:
      required: true

  - type: input
    id: dialect
    attributes:
      label: 方言（如相关）
      placeholder: "MySqlDialect / default"

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小化复现
      description: |
        最好提供一段自包含的代码（实体 + session 调用）。
        省略与故障无关的样板代码。
      render: java
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: 堆栈 / 日志
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: |
        变通方案、相关 Issue、对根因的推测等。

  - type: checkboxes
    id: terms
    attributes:
      label: 贡献检查清单
      options:
        - label: 我已先搜索过已有 Issue
          required: true
        - label: 这不是安全问题（见 SECURITY.md）
          required: true
