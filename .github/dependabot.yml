version: 2
updates:
  # 保持 jorm-core 核心模块的 Maven 依赖为最新版本。
  - package-ecosystem: "maven"
    directory: "/jorm-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework:*"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.hamcrest*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
    ignore:
      # Spring Boot 2.7.x 是受支持的基线版本;未经显式的迁移工作
      # 不要自动升级到 3.x。
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:spring-core"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(core)"
      include: "scope"
    labels:
      - "dependencies"
      - "core"

  # 保持 starter 模块的 Maven 依赖为最新版本。
  - package-ecosystem: "maven"
    directory: "/jorm-spring-boot-starter"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.data:*"
      cache:
        patterns:
          - "org.springframework.boot:spring-boot-starter-data-redis"
          - "redis.clients:*"
          - "com.redis:testcontainers-redis"
          - "it.ozimov:embedded-redis"
      testcontainers:
        patterns:
          - "org.testcontainers:*"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.github.jadendu:jorm"
        # 不要让 dependabot 升级我们对内部 core 快照的依赖 —
        # core 发布时会手动提升该版本。
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(starter)"
      include: "scope"
    labels:
      - "dependencies"
      - "starter"

  # GitHub Actions 本身。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"