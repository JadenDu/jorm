name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 一次 deploy 推三个 GAV (jorm-parent + jorm-core + jorm-spring-boot-starter)
  # 到 Central Portal 的同一个 staging deployment.
  MAVEN_CLI_OPTS: "-B -ntp -DfailIfNoTests=false -DskipTests"

jobs:
  release:
    name: Release jorm (parent + core + starter) to Maven Central
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Decode GPG signing key
        run: |
          printf "%s" "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | base64 -d > $HOME/secring.gpg
          echo "GPG_KEY=$HOME/secring.gpg" >> $GITHUB_ENV

      - name: Configure settings.xml
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>\${env.OSSRH_USERNAME}</username>
                <password>\${env.OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # versions:set -N 只更新根 (聚合器) pom;由于子模块通过
          # <parent> 继承版本号,它们会自动跟随更新。
          mvn versions:set -N -DnewVersion=$VERSION -DgenerateBackupPoms=false
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Deploy (gpg-signed sources + javadoc for all three GAVs)
        run: mvn $MAVEN_CLI_OPTS clean deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ env.GPG_KEY }}

      - name: Publish to Central Portal
        run: mvn $MAVEN_CLI_OPTS central-publishing:publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Clean up signing key
        if: always()
        run: rm -f $HOME/secring.gpg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: jorm-core/target/CHANGELOG-snippet.md
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}