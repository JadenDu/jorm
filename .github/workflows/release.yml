name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_CLI_OPTS: "-B -ntp -DfailIfNoTests=false"

jobs:
  release-core:
    name: Release jorm to Maven Central
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Decode GPG signing key
        run: |
          printf "%s" "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | base64 -d > $HOME/secring.gpg
          echo "GPG_KEY=$HOME/secring.gpg" >> $GITHUB_ENV

      - name: Configure settings.xml
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>\${env.OSSRH_USERNAME}</username>
                <password>\${env.OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Prepare release
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mvn -f jorm-core/pom.xml versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Deploy (gpg-signed sources + javadoc)
        run: mvn -f jorm-core/pom.xml $MAVEN_CLI_OPTS clean deploy -DskipTests
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ env.GPG_KEY }}

      - name: Publish to Central Portal
        run: mvn -f jorm-core/pom.xml $MAVEN_CLI_OPTS central-publishing:publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Clean up signing key
        if: always()
        run: rm -f $HOME/secring.gpg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: jorm-core/target/CHANGELOG-snippet.md
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}

  release-starter:
    name: Release jorm-spring-boot-starter to Maven Central
    runs-on: ubuntu-latest
    needs: release-core
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Decode GPG signing key
        run: |
          printf "%s" "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | base64 -d > $HOME/secring.gpg
          echo "GPG_KEY=$HOME/secring.gpg" >> $GITHUB_ENV

      - name: Configure settings.xml
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>\${env.OSSRH_USERNAME}</username>
                <password>\${env.OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Prepare release
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mvn -f jorm-spring-boot-starter/pom.xml versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Deploy
        run: mvn -f jorm-spring-boot-starter/pom.xml $MAVEN_CLI_OPTS clean deploy -DskipTests
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ env.GPG_KEY }}

      - name: Publish to Central Portal
        run: mvn -f jorm-spring-boot-starter/pom.xml $MAVEN_CLI_OPTS central-publishing:publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}