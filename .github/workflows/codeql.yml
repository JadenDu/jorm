name: codeql

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.java"
      - "**/pom.xml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/pom.xml"
  schedule:
    - cron: "26 6 * * 1"

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: +security-and-quality

      - name: Build (skip tests for speed)
        run: |
          mvn -f jorm-core/pom.xml -B -ntp -DskipTests -Dgpg.skip=true clean install
          mvn -f jorm-spring-boot-starter/pom.xml -B -ntp -DskipTests -Dgpg.skip=true clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "jorm-java"