name: codeql

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.java"
      - "**/pom.xml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/pom.xml"
  schedule:
    - cron: "26 6 * * 1"

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: +security-and-quality

      - name: Build (skip tests for speed)
        run: >-
          mvn -B -ntp -DskipTests -Dgpg.skip=true
          -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true
          clean install
        # 从根聚合 pom 构建: -f 子模块方式不会 install jorm-parent 到 .m2,
        # 导致 starter 解析 jorm-core 的 artifact descriptor 时找不到 parent pom.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "jorm-java"