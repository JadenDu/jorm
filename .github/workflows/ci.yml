name: ci

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Dmaven.repo.frontend=true"
  # 聚合构建: 在根 pom 上跑, reactor 自动按 jorm-core -> jorm-spring-boot-starter
  # 顺序构建, 无需手动两段式.
  MAVEN_CLI_OPTS: "-B -ntp -Dmaven.test.failure.ignore=false -Dgpg.skip=true"

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [11, 17, 21]
        include:
          # Flag reference platform combo in summary views.
          - java: 11
            os: ubuntu-latest
            primary: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show environment
        run: |
          java -version
          mvn -v

      # 形式校验 (spotless/checkstyle/spotbugs) 只在 jorm-core 跑一次即可,
      # 因为 starter 侧的同类插件走相同配置 + 相同 build-tools/.-am 同时
      # build 依赖的 core 模块, 满足 reactor 解析需要.
      - name: Spotless check (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am spotless:check

      - name: Checkstyle (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am checkstyle:check

      - name: SpotBugs (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am spotbugs:check

      # 完整 verify: reactor 负责顺序, jacoco 覆盖率闸门仅在 core 生效.
      - name: Verify (tests + coverage gate on core)
        run: mvn ${{ env.MAVEN_CLI_OPTS }} verify -Dtest='!*IntegrationTest,*CRUDTest' -DfailIfNoTests=false

      - name: Upload JaCoCo report (core)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-core-${{ matrix.os }}-jdk${{ matrix.java }}
          path: jorm-core/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests (Testcontainers, JDK 11)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref_protected
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Run Testcontainers-based starter integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-spring-boot-starter -am verify