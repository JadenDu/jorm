name: ci

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Dmaven.repo.frontend=true"
  # 聚合构建: 在根 pom 上跑, reactor 自动按 jorm-core -> jorm-spring-boot-starter
  # 顺序构建, 无需手动两段式.
  # 注意: -D 参数必须带双引号, 否则 windows runner 的 PowerShell 会在 "=" 处
  # 把参数拆开, 导致 Maven 报 "Unknown lifecycle phase" 错误.
  MAVEN_CLI_OPTS: -B -ntp "-Dmaven.test.failure.ignore=false" "-Dgpg.skip=true"

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [11, 17, 21]
        include:
          # 在概览视图中标记参考平台组合。
          - java: 11
            os: ubuntu-latest
            primary: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show environment
        run: |
          java -version
          mvn -v

      # 形式校验 (spotless/checkstyle/spotbugs) 只在 jorm-core 跑一次即可,
      # 因为 starter 侧的同类插件走相同配置 + 相同 build-tools/.
      # -pl jorm-core -am: 仅构建 core, 同时 build 依赖的 parent (reactor 需要).
      - name: Spotless check (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am spotless:check

      - name: Checkstyle (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am checkstyle:check

      - name: SpotBugs (core)
        if: always()
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am spotbugs:check

      # Core: 跑全部测试 + jacoco 覆盖率闸门, 然后 install 到 .m2 供 starter 复用.
      - name: Verify & install core (tests + coverage gate)
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-core -am install

      # Starter: 静态检查 (checkstyle/spotbugs/jacoco) 编译验证.
      # starter 的测试全部依赖 localhost MySQL + Redis, 移到 integration job
      # (那里有 MySQL 服务容器) 统一执行; windows runner 无法挂服务容器.
      - name: Verify starter (static checks; tests run in integration job)
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-spring-boot-starter verify -DskipTests

      - name: Upload JaCoCo report (core)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-core-${{ matrix.os }}-jdk${{ matrix.java }}
          path: jorm-core/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests (MySQL + Redis, JDK 11)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref_protected
    # starter 测试直连 localhost:3306 (库 orm, root/root), 用服务容器提供 MySQL;
    # 嵌入式 Redis 直接用 runner 自带的 redis-server.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Create users table
        run: >-
          docker run --rm --network host mysql:8.0
          mysql -h 127.0.0.1 -uroot -proot orm
          -e "CREATE TABLE IF NOT EXISTS users (id BIGINT PRIMARY KEY AUTO_INCREMENT,
          user_name VARCHAR(255), age INT, status VARCHAR(255), department VARCHAR(255))"
      - name: Run starter integration tests (MySQL service + embedded Redis)
        run: mvn ${{ env.MAVEN_CLI_OPTS }} -pl jorm-spring-boot-starter -am verify