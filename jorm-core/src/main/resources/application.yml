# JORM 级配置示例。真实的生成环境取值应放在可部署应用自身的配置中;
# 本示例仅用于说明配置结构,鼓励直接从本文件复制使用。
spring:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

jorm:
  # 连接池 / 方言 / 批量处理钩子 (参见 JormProperties)。
  # 这里的所有键也都会被 starter 接受。
  batch-size: 100
  naming-strategy: default     # default | identity | FQCN 命名策略枚举值
  # 省略时根据 jdbc-url 自动探测方言;对非标准 JDBC URL 可显式设置。
  # dialect: MySQL

  cache:
    redis:
      enabled: true
      default-expiration: 3600
      key-prefix: "jorm:cache:"
      use-key-prefix: true
      cache-null-values: false