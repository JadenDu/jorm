# MySQL 数据库连接配置
jorm.jdbc-url=jdbc:mysql://localhost:3306/orm
jorm.username=root
jorm.password=root
jorm.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis 缓存配置(未启用 Redis 时忽略)
spring.redis.port=6379
spring.redis.host=localhost

# JORM 缓存配置
jorm.cache.redis.enabled=true
jorm.cache.redis.default-expiration=3600
jorm.cache.redis.key-prefix=jorm:cache:
jorm.cache.redis.use-key-prefix=true
jorm.cache.redis.cache-null-values=false